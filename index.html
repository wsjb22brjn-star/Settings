<!DOCTYPE html><html lang="he" dir="rtl"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>הגדרות</title>
<style>
:root{--bg:#f3f4f6;--card:#fcfcfe;--tx:#111;--sub:#777;--ln:#e6e7ea;--ac:#3b7bff;--hint:#e5eaf6;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0e0f12;--card:#1c1d21;--tx:#f1f1f3;--sub:#9a9ba2;--ln:#2c2d32;--hint:#1d2433}}
*{box-sizing:border-box}html,body{margin:0}
body{background:var(--bg);color:var(--tx);font-family:system-ui,"Segoe UI",Arial,sans-serif;display:flex;justify-content:center}
#app{width:100%;max-width:480px;padding:16px 14px 90px}
h1{font-size:calc(30px*var(--fs)*.92);margin:60px 0 40px;text-align:center}
h2{font-size:calc(22px*var(--fs)*.92);margin:14px 6px 18px;display:flex;align-items:center;gap:10px}
.back{width:36px;height:36px;border:0;background:none;color:var(--tx);font-size:calc(26px*var(--fs)*.92);cursor:pointer;padding:0}
.card{background:var(--card);border-radius:26px;margin:0 0 14px;overflow:hidden}
.row{display:flex;align-items:center;gap:14px;padding:16px 18px;border-bottom:1px solid var(--ln);cursor:pointer;min-height:56px}
.card .row:last-child{border-bottom:0}
.row .t{flex:1}.row .t b{font-weight:400;font-size:calc(17px*var(--fs)*.92);display:block}.row .t small{display:block;color:var(--sub);font-size:calc(13px*var(--fs)*.92);margin-top:3px;white-space:pre-line;direction:ltr;text-align:right}
.row .t small.rt{direction:rtl}
.ic{width:34px;height:34px;border-radius:50%;flex:none;display:grid;place-items:center}
.ic i{width:14px;height:14px;border:2.5px solid #fff;border-radius:4px}
.prof{display:flex;align-items:center;gap:14px;padding:18px;cursor:default}
.av{width:60px;height:60px;border-radius:50%;background:#c9ccd4;display:block;position:relative;overflow:hidden}.av i{position:absolute;left:21px;top:11px;width:18px;height:18px;border-radius:50%;background:#fff}.av::after{content:"";position:absolute;left:12px;top:34px;width:36px;height:36px;border-radius:50%;background:#fff}img.ic{width:40px;height:40px;border-radius:50%;object-fit:cover}img.ap{border-radius:10px}.pic{width:100%;border-radius:26px;display:block;margin:0 0 16px}
.prof small{color:var(--ac);font-size:calc(14px*var(--fs)*.92)}
.sw{width:50px;height:28px;border-radius:14px;background:var(--ac);position:relative;flex:none;border:0;cursor:pointer}
.sw::after{content:"";position:absolute;top:3px;right:3px;width:22px;height:22px;border-radius:50%;background:#fff;transition:.15s}
.sw.off{background:#b9bcc4}.sw.off::after{right:25px}
.sw[disabled]{opacity:.5;cursor:default}
.dis{opacity:.55}
.hint{background:var(--hint);border-radius:26px;padding:18px;margin-top:20px}
.hint b{display:block;margin-bottom:12px}
.hint a{display:block;color:var(--ac);padding:8px 0;cursor:pointer}
.note{color:var(--sub);font-size:calc(14px*var(--fs)*.92);line-height:1.6;margin:8px 8px 16px}
.note a{color:var(--ac);cursor:pointer}
.btn{display:block;margin:0 auto;width:80%;padding:18px;border:0;border-radius:40px;background:var(--ac);color:#fff;font-size:calc(17px*var(--fs)*.92);font-weight:600;cursor:pointer}
.hero{height:280px;display:grid;place-items:center;font-size:calc(40px*var(--fs)*.92);font-weight:800;background:radial-gradient(circle at 55% 35%,#aebdf0,transparent 55%),radial-gradient(circle at 40% 70%,#f1d9cc,transparent 55%);margin:20px 0}
.big{height:200px;border-radius:26px;background:linear-gradient(135deg,#d9a27c,#9fbbdc 55%,#3d78e0);margin-bottom:16px}
.radio{width:24px;height:24px;border-radius:50%;border:2px solid #9a9ca4;flex:none}
.radio.on{border:7px solid var(--ac)}
.dev{display:flex;gap:16px;align-items:center;padding:20px}
.ph{width:56px;height:104px;border-radius:12px;background:#1f2638;padding:4px;flex:none}
.ph div{height:100%;border-radius:8px;background:linear-gradient(160deg,#8f7bff,#c5d4ff)}
.dev b{font-size:calc(22px*var(--fs)*.92);display:block;margin-bottom:6px}.dev span{display:block;color:var(--sub);font-size:calc(14px*var(--fs)*.92);margin:3px 0}
.search{position:fixed;bottom:calc(18px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);width:min(320px,70vw);background:var(--card);border-radius:30px;padding:16px 22px;box-shadow:0 4px 18px #0002;font-weight:600;color:var(--sub);text-align:right}
.menu{position:relative}.mb{position:absolute;left:0;top:0;border:0;background:none;color:var(--tx);font-size:calc(24px*var(--fs)*.92);cursor:pointer}
.pop{position:absolute;left:0;top:36px;background:var(--card);border-radius:22px;box-shadow:0 4px 20px #0003;z-index:5;min-width:170px}
.pop div{padding:14px 20px;cursor:pointer}
ul.d{list-style:none;margin:0;padding:0 6px}ul.d li{color:var(--sub);padding:5px 0;font-size:calc(15px*var(--fs)*.92)}
.sec{color:var(--sub);font-size:calc(14px*var(--fs)*.92);margin:18px 8px 8px;font-weight:600}
.inp{width:100%;padding:14px 18px;border-radius:26px;border:1px solid var(--ln);background:var(--card);color:var(--tx);font-size:calc(16px*var(--fs)*.92)}
#so{position:fixed;inset:0;background:var(--bg);z-index:30;padding:calc(16px + env(safe-area-inset-top,0px)) 14px 14px;overflow:auto;max-width:480px;margin:auto}
.sh{display:flex;gap:8px;align-items:center;margin-bottom:16px}
input[type=range]{width:100%;accent-color:var(--ac);margin-top:10px}
.bar{height:14px;border-radius:7px;background:var(--ln);margin:14px 0;overflow:hidden}.bar i{display:block;height:100%;background:#4cc26b;float:right}
:root[data-theme="dark"]{--bg:#0e0f12;--card:#1c1d21;--tx:#f1f1f3;--sub:#9a9ba2;--ln:#2c2d32;--hint:#1d2433}
#dg{position:fixed;inset:0;background:#0006;z-index:40;display:grid;place-items:center}#dg[hidden]{display:none}
.dgc{background:var(--card);border-radius:28px;padding:22px;width:90%;max-width:420px}.dgb{display:flex;gap:10px;justify-content:flex-end}
.dgb button{border:0;background:none;color:var(--ac);font-size:calc(17px*var(--fs)*.92);font-weight:600;padding:10px 16px;cursor:pointer}
#app{padding:48px 14px 140px}h2{font-size:calc(25px*var(--fs)*.92)}
h1{font-size:calc(36px*var(--fs)*.92);margin:80px 0 120px}
#sb{position:fixed;top:0;left:50%;transform:translateX(-50%);width:100%;max-width:480px;height:40px;padding:8px 22px 0;display:flex;justify-content:space-between;font-size:calc(15px*var(--fs)*.92);z-index:15;background:linear-gradient(var(--bg) 60%,transparent);pointer-events:none}
.pill{background:#777;color:#fff;border-radius:12px;padding:0 9px;font-weight:600;height:20px;line-height:20px;font-size:calc(13px*var(--fs)*.92)}
#nb{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:480px;height:calc(52px + env(safe-area-inset-bottom,0px));padding-bottom:env(safe-area-inset-bottom,0px);display:flex;justify-content:space-around;align-items:center;background:var(--bg);z-index:15}
#nb button{background:none;border:0;color:var(--sub);cursor:pointer;padding:10px 24px}
.search{display:flex;justify-content:space-between;align-items:center;bottom:calc(64px + env(safe-area-inset-bottom,0px));z-index:12}.search span{display:flex;gap:8px;align-items:center}
.row{min-height:52px}
.vd{width:1px;height:28px;background:var(--ln);flex:none}
.bl{color:var(--ac)!important}
.upd{display:flex;flex-direction:column;min-height:calc(100vh - 190px)}
.upd .hero{flex:1;margin:0;font-size:calc(46px*var(--fs)*.92);letter-spacing:-1px;background:radial-gradient(ellipse 45% 30% at 55% 38%,#aebdf0,transparent),radial-gradient(ellipse 40% 28% at 40% 62%,#f4d9cc,transparent)}
.upd .btn{margin-bottom:10px}
.dim{position:fixed;inset:0;background:#0007;z-index:20;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--card);border-radius:28px;margin:12px;padding:24px;width:100%;max-width:456px;text-align:right}.sheet b{font-size:calc(20px*var(--fs)*.92)}.sheet a{display:block;text-align:center;font-weight:700;font-size:calc(18px*var(--fs)*.92);padding-top:14px;cursor:pointer}
ul.b li{color:var(--tx);font-size:calc(16px*var(--fs)*.92);padding:6px 0}ul.b li::before{content:"\2022\00a0"}
.cov{position:relative;margin:-48px -14px 0}.cov img{width:100%;display:block}
.circ{position:absolute;top:60px;right:14px;width:46px;height:46px;border-radius:50%;background:#fffd;color:#111;display:grid;place-items:center}
.lt{padding:14px 6px}.lt h3{font-size:calc(30px*var(--fs)*.92);margin:14px 0 4px}.lt p{margin:4px 0 14px}.lt .ul{display:block;margin:22px 0;font-weight:700;text-decoration:underline;cursor:pointer}.lt hr{border:0;border-top:1px solid var(--ln);margin:0 0 20px}
.r2{display:flex;justify-content:space-between;padding:6px 0;font-size:calc(16px*var(--fs)*.92)}.r2 .lb{color:var(--sub)}.r2 span:last-child{direction:ltr}
.sh2{border-top:2px dotted var(--ln);margin-top:14px;padding-top:12px;font-weight:700;font-size:calc(18px*var(--fs)*.92);color:var(--sub);display:flex;justify-content:space-between}
.bg2 .row{min-height:68px}.bg2 .row b{font-size:calc(20px*var(--fs)*.92)}
#app{padding:20px 14px 130px}.cov{margin:-20px -14px 0}.circ{top:24px}h1{margin:60px 0 110px}
.search{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(14px + env(safe-area-inset-bottom,0px));width:min(290px,64vw);padding:0;background:none;box-shadow:none;border-radius:0;display:block;filter:drop-shadow(0 4px 12px #0003);z-index:12}
.search img{display:block;width:100%;clip-path:inset(10% 2.4% 10% 2.4% round 999px)}
.search input{position:absolute;right:17%;left:20%;top:28%;height:44%;width:auto;border:0;background:transparent;outline:0;text-align:right;direction:rtl;font:600 15px system-ui,Arial,sans-serif;color:#222;padding:0;-webkit-appearance:none}
.search input::placeholder{color:#7a7a80;opacity:1}.search input::-webkit-search-cancel-button{display:none}
#sl{display:none}#sl.on{display:block;position:fixed;left:50%;transform:translateX(-50%);bottom:calc(110px + env(safe-area-inset-bottom,0px));width:calc(100% - 28px);max-width:452px;max-height:55vh;overflow:auto;z-index:13;background:var(--card);border-radius:26px;box-shadow:0 4px 22px #0003}#sl .card{margin:0}
html{--fs:1}body{font-size:calc(16px*var(--fs)*.92)}
.fb{width:48px;height:48px;border-radius:50%;border:0;background:var(--ln);color:var(--tx);font-size:calc(18px*var(--fs)*.92);font-weight:700;cursor:pointer;flex:none}
#bk{position:fixed;top:calc(10px + env(safe-area-inset-top,0px));right:calc(max(0px,(100vw - 480px)/2) + 14px);width:44px;height:44px;border-radius:50%;border:0;background:var(--card);color:var(--tx);box-shadow:0 2px 10px #0002;display:grid;place-items:center;cursor:pointer;z-index:14;padding:0}
h2 .back,.menu>.back,.circ{display:none!important}

const ic=(c,t)=>IMG[t]?`<img class="ic" src="${IMG[t]}" alt="">`:`<span class="ic" style="background:${C[c]}"><i></i></span>`;

const hd=(t,b)=>`<h2><button class="back" onclick="go('${b||''}')"><svg width="14" height="26" viewBox="0 0 14 26"><polyline points="2,2 12,13 2,24" fill="none" stroke="currentColor" stroke-width="2"/></svg></button>${t}</h2>`;
const row=(t,s,go,extra,ico)=>`<div class="row" ${go?`onclick="go('${go}')"`:(extra?'':`onclick="dt(${PL.push([t,s])-1})"`)}>${ico||''}<div class="t"><b>${t}</b>${s?`<small class="rt${s=="סיסמה, טביעת אצבע"?" bl":""}">${s}</small>`:''}</div>${extra||''}</div>`;

const sw2=(label,k)=>row(label,'',0,sw(k));
